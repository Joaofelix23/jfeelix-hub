<style>
/* ==================================================
   1. PALETA MACKA
================================================== */

:root {
  --terra: #360b13;
  --cream: #fefdd7;
  --caramelo: #b26c3b;
  --pedra: #e6d9d4;
  --marrom: #3b1f1b;

  --ink: #0f0e0d;
  --dark: #161412;
  --dark2: #3b1f1b;
  --paper: #e6d9d4;
  --olive: #b26c3b;
  --peach: #e6d9d4;

  --f: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.16,.84,.24,1);
  --pad: 28px;
}

/* ==================================================
   2. RESET
================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  height: auto;
  min-height: 100%;
  overflow-x: clip;
  overflow-y: auto;
  scroll-behavior: smooth;
  scroll-padding-top: 20px;
}

body {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow-x: clip;
  overflow-y: visible;
  font-family: var(--f);
  background: var(--dark);
  color: var(--paper);
  -webkit-font-smoothing: antialiased;
  line-height: 1.35;
}

a {
  color: inherit;
}

img {
  display: block;
  max-width: 100%;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

.sm {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -.01em;
  text-transform: uppercase;
}

.xs {
  font-size: 12.5px;
  line-height: 1.4;
}

.big {
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -.055em;
  line-height: .84;
}

/* ==================================================
   4. ANIMAÇÕES DE ENTRADA
================================================== */

.js [data-r] {
  opacity: 0;
  transform: translate3d(0, 28px, 0);
  transition:
    opacity .8s var(--ease),
    transform .9s var(--ease);
}

.js [data-r].in {
  opacity: 1;
  transform: translate3d(0, 0, 0);
}

.line {
  display: block;
  overflow: hidden;
  padding: .14em 0 .1em;
  margin: -.14em 0 -.1em;
}

.line > span {
  display: block;
}

.js .split .line > span {
  transform: translate3d(0, 112%, 0);
  transition: transform 1.1s var(--ease);
}

.js .split.in .line > span {
  transform: translate3d(0, 0, 0);
}

/* ==================================================
   5. CAPA (LAYOUT REAJUSTADO SEM O GIRASSOL)
================================================== */

.cover {
  position: relative;
  background: var(--terra);
  color: var(--cream);
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 22px var(--pad) 40px;
  overflow: hidden;
}

.cover-top {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 16px;
  align-items: start;
}

.cover-top nav {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
}

.cover-top nav a {
  text-decoration: none;
}

.cover-top nav a:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.cover-top .r {
  text-align: right;
}

.cover h1 {
  position: relative;
  margin: auto 0;
  padding: 20px 0;
  line-height: .8;
  white-space: nowrap;
  will-change: transform;
  text-align: center;
}

.cover h1 span {
  display: inline-block;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -.055em;
  font-size: 19vw;
}

.js .cover h1 span {
  transform: translate3d(0, 108%, 0);
}

.js.ready .cover h1 span {
  transform: translate3d(0, 0, 0);
  transition: transform 1.5s var(--ease) .1s;
}

/* ==================================================
   6. SEÇÃO SOBRE + PORTFÓLIOS
================================================== */

.sec {
  padding: 28px var(--pad) 110px;
}

.dupla {
  display: grid;
  grid-template-columns: minmax(320px, .78fr) 1.6fr;
  gap: 14px;
  align-items: start;
}

.sobre {
  align-self: start;
  position: sticky;
  top: 24px;
  background: var(--cream);
  color: var(--ink);
  border-radius: 22px;
  padding: 28px;
}

.sobre h2 {
  font-size: clamp(56px, 7.4vw, 124px);
  margin-bottom: 26px;
}

.sobre .txt {
  font-size: 15px;
  line-height: 1.5;
  margin-bottom: 14px;
}

.sobre .bloco {
  border-top: 1px solid #8b8d89;
  padding-top: 14px;
  margin-top: 18px;
}

.sobre h4 {
  margin-bottom: 10px;
}

.sobre .item {
  font-size: 12.5px;
  line-height: 1.4;
  margin-bottom: 8px;
}

.sobre .item b {
  display: block;
}

.sobre .contato a {
  display: inline-block;
  text-decoration: none;
  border-bottom: 1.5px solid var(--ink);
  overflow-wrap: anywhere;
}

.sobre .contato p {
  margin-bottom: 5px;
}

/* ==================================================
   7. BLOCOS DOS PORTFÓLIOS
================================================== */

.bento {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: minmax(300px, auto);
  gap: 14px;
}

.tile {
  grid-column: span var(--s, 1);
  position: relative;
  min-width: 0;
  overflow: hidden;
  border-radius: 22px;
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-decoration: none;
  color: var(--ink);
  transition: transform .45s var(--ease);
}

a.tile:hover {
  transform: translateY(-6px) rotate(-.4deg);
}

.tile .top {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 2;
}

.tile .bot {
  position: relative;
  z-index: 2;
}

.tile h3 {
  font-size: clamp(34px, 4.6vw, 76px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -.055em;
  line-height: .82;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}

.tile .arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  transition: transform .3s;
}

.tile .arrow svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

a.tile:hover .arrow {
  transform: translate(5px, -5px);
}

.pill {

  border: 1.5px solid currentColor;
